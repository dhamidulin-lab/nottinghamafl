<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dd0000">
<title>Ноттингем Форест — In Forest We Trust</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="css">
:root{--red:#dd0000;--red-d:#a80000;--ink:#16181d;--muted:#6b7280;--line:#e7e2da;--bg:#f6f3ee;--card:#fff;
  --w:#16a34a;--d:#a1a1aa;--l:#dc2626;--gk:#e8a317;--def:#2563eb;--mid:#059669;--fwd:#dd0000;--uni:#7c3aed}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
a{color:inherit;text-decoration:none}
h1,h2,h3,.oswald{font-family:Oswald,Inter,sans-serif;font-weight:600;letter-spacing:.3px}
h2{font-size:18px;text-transform:uppercase;margin:0 0 12px}
h3{font-size:15px;text-transform:uppercase;margin:0 0 10px;color:var(--muted)}
/* Шапка */
.top{background:var(--red);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 20px}
.top img{height:52px;width:auto;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.15))}
.brand b{font-family:Oswald,sans-serif;font-size:20px;text-transform:uppercase;display:block;line-height:1.1}
.brand span{font-size:11px;opacity:.85}
nav{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap}
nav a{padding:8px 12px;border-radius:8px;font-weight:600;font-size:13px;opacity:.9}
nav a:hover{background:rgba(255,255,255,.12);opacity:1}
nav a.on{background:#fff;color:var(--red);opacity:1}
nav svg{display:none}
main{max-width:1180px;margin:0 auto;padding:20px}
@media(max-width:760px){main{padding:12px}}
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}
.muted{color:var(--muted)}.small{font-size:12px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:#f1eee8;color:#57534e}
.res{display:inline-flex;width:22px;height:22px;border-radius:6px;color:#fff;font-weight:700;font-size:11px;align-items:center;justify-content:center}
.res.W{background:var(--w)}.res.D{background:var(--d)}.res.L{background:var(--l)}
.pos{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;color:#fff;letter-spacing:.4px}
.p-ВРТ{background:var(--gk)}.p-ЗАЩ{background:var(--def)}.p-ПЗЩ{background:var(--mid)}.p-НАП{background:var(--fwd)}.p-УНИ{background:var(--uni)}
.crest{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font:600 12px Oswald,sans-serif;flex:none}
.crest.us{background:var(--red) var(--logo) center/58% no-repeat}
/* Hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:900px){.hero{grid-template-columns:1fr}}
.next{background:linear-gradient(135deg,#1b1d22,#2a2d34);color:#fff;border-radius:14px;padding:20px;position:relative;overflow:hidden}
.next::after{content:"";position:absolute;right:-30px;bottom:-40px;width:200px;height:260px;background:var(--logo) center/contain no-repeat;opacity:.06;pointer-events:none}
.next .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.7}
.vs{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0}
.vs .t{flex:1;text-align:center;font-family:Oswald,sans-serif;font-size:18px}
.vs .t .crest{width:56px;height:56px;font-size:18px;margin-bottom:6px}
.vs .mid{font-family:Oswald,sans-serif;font-size:28px;min-width:90px;text-align:center}
.next .meta{font-size:12px;opacity:.8;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:#faf8f5;border-radius:10px;padding:12px}
.tile b{font-family:Oswald,sans-serif;font-size:26px;display:block;line-height:1.1}
.tile span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.form{display:flex;gap:4px}
/* Списки матчей */
.mrow{display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:center;padding:10px 6px;border-bottom:1px solid #f0ece6;cursor:pointer;border-radius:8px}
.mrow:hover{background:#faf8f5}
.mrow .dt{font-size:12px;color:var(--muted);line-height:1.3}
.mrow .dt b{display:block;color:var(--ink);font-size:13px}
.mrow .teams{display:flex;align-items:center;gap:8px;min-width:0}
.mrow .teams .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .sc{font-family:Oswald,sans-serif;font-size:18px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* Таблицы */
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th[data-s]{cursor:pointer}th.on{color:var(--ink)}
td{padding:8px 6px;border-bottom:1px solid #f3f0eb;vertical-align:middle}
.c{text-align:center}
tr.link{cursor:pointer}tr.link:hover td{background:#faf8f5}
.no{font-family:Oswald,sans-serif;font-weight:600;font-size:16px;width:34px}
.scroll-x{overflow-x:auto}
/* Игроки */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.pcard{background:#fff;border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:transform .1s,box-shadow .1s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.badge{width:46px;height:46px;border-radius:12px;background:var(--red);color:#fff;font:600 20px Oswald,sans-serif;display:flex;align-items:center;justify-content:center;flex:none}
.badge.gk{background:var(--gk)}
.pcard .nm{font-weight:600;line-height:1.25}
.pcard .st{font-size:12px;color:var(--muted)}
.phead{display:flex;gap:20px;align-items:center;background:linear-gradient(135deg,var(--red),var(--red-d));color:#fff;border-radius:14px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden}
.phead::after{content:"";position:absolute;right:10px;top:-10px;width:150px;height:230px;background:var(--logo) center/contain no-repeat;opacity:.14}
.phead .big{font:700 64px/1 Oswald,sans-serif;opacity:.95;min-width:80px}
.phead h1{margin:0;font-size:30px;text-transform:uppercase;line-height:1.1}
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.info div{background:#faf8f5;border-radius:10px;padding:10px 12px}
.info b{display:block;font-size:15px}
.info span{font-size:11px;color:var(--muted);text-transform:uppercase}
.back{display:inline-block;margin-bottom:12px;color:var(--muted);font-weight:600;font-size:13px}
.back:hover{color:var(--ink)}
/* Матч */
.mhead{background:#1b1d22;color:#fff;border-radius:14px;padding:22px;margin-bottom:16px;text-align:center}
.mhead .vs .mid{font-size:44px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:1fr 46px 1fr;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #eee}
.tl .min{text-align:center;font:600 13px Oswald,sans-serif;color:var(--muted)}
.tl .l{text-align:right}.tl .ic{display:inline-block;width:12px;height:16px;border-radius:2px;vertical-align:-3px;margin:0 4px}
.ic.y{background:#facc15}.ic.r{background:#dc2626}
.ball{display:inline-block;margin:0 4px}
/* Состав */
.lineup{display:grid;grid-template-columns:minmax(300px,520px) 1fr;gap:16px}
@media(max-width:900px){.lineup{grid-template-columns:1fr}}
.pitch{position:relative;width:100%;aspect-ratio:68/90;border-radius:12px;overflow:hidden;background:repeating-linear-gradient(0deg,#2f7d3e 0 10%,#2a7238 10% 20%)}
.pitch svg{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:84px;user-select:none}
.edit .slot{cursor:pointer}
.shirt{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 18px Oswald,sans-serif;background:rgba(255,255,255,.18);border:2px dashed rgba(255,255,255,.7);color:#fff;position:relative;transition:transform .12s,box-shadow .12s}
.slot.f .shirt{background:var(--kit,var(--red));border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.slot.f.gk .shirt{background:var(--kit,#16a34a)}
.slot.sel .shirt{box-shadow:0 0 0 4px #ffe066;transform:scale(1.08)}
.slot.warn .shirt::after{content:"!";position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:#ffe066;color:#000;font:700 11px Inter;display:flex;align-items:center;justify-content:center}
.cap{position:absolute;bottom:-4px;left:-4px;width:17px;height:17px;border-radius:50%;background:#fff;color:var(--red);font:700 10px Inter;display:flex;align-items:center;justify-content:center}
.slot .nm{margin-top:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 6px;border-radius:5px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .role{font-size:10px;color:rgba(255,255,255,.85);margin-top:2px}
.rm{position:absolute;top:-6px;right:10px;width:18px;height:18px;border-radius:50%;background:#111;color:#fff;font-size:12px;line-height:18px;text-align:center;display:none}
.edit .slot.f:hover .rm,.edit .slot.sel .rm{display:block}
select,input[type=search],button{font:inherit}
select,input[type=search]{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:#fff}
button{cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;padding:7px 12px}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.red{background:var(--red);color:#fff;border-color:var(--red)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:#f3f1ec;border-radius:999px;padding:4px 8px 4px 4px;font-size:12px}
.chip b{font-family:Oswald,sans-serif;background:var(--ink);color:#fff;border-radius:999px;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-weight:500}
.chip .x{cursor:pointer;color:var(--muted);padding:0 2px}
.notice{padding:10px 12px;border-radius:10px;background:#fff7e6;color:#7a4b00;font-size:13px;margin-bottom:12px}
.notice.ok{background:#ecfdf3;color:#05603a}
.lst{max-height:60vh;overflow:auto}
.lst tr.in td{background:#fdecec}.lst tr.bn td{background:#eef2ff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
textarea#out{width:100%;height:140px;font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;display:none;margin-top:8px}
.bar{height:6px;border-radius:3px;background:#efe9e1;overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}
.leader{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #f3f0eb}
.leader .v{font:600 18px Oswald,sans-serif}
footer{text-align:center;color:var(--muted);font-size:11px;padding:20px}
footer a{text-decoration:underline}

.kit{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;font-size:12px;font-weight:600;text-transform:capitalize}.kit i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}.kit.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px;border:1px solid rgba(0,0,0,.2)}

.subbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.subbar button{width:38px;height:34px;padding:0;font-size:14px}
.tlwrap{position:relative;flex:1}
.tlwrap input{width:100%;accent-color:var(--red)}
.tick{position:absolute;top:-6px;width:2px;height:8px;background:var(--red);transform:translateX(-1px);pointer-events:none}
.tmin{font-family:Oswald,sans-serif;min-width:52px;text-align:right}
.sb{position:absolute;right:-26px;font:700 10px Inter,sans-serif;padding:1px 4px;border-radius:4px;color:#fff;white-space:nowrap;line-height:14px}
.sb.out{top:-6px;background:#dc2626}.sb.in{bottom:-6px;background:#16a34a}
.sb.in+.sb.out,.sb.out:only-child{}
.slot.justin .shirt{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
ul.subs{list-style:none;margin:0;padding:0}
ul.subs li{display:grid;grid-template-columns:44px 1fr 1fr 20px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #f3f0eb;font-size:13px}
.smin{font:600 15px Oswald,sans-serif;color:var(--muted)}
.so{color:#b91c1c}.si{color:#15803d}
.so b,.si b{font-family:Oswald,sans-serif}
ul.subs .x{cursor:pointer;color:var(--muted)}
.subform input{padding:7px 8px;border-radius:8px;border:1px solid var(--line)}

.slot,.chip[data-fp]{cursor:pointer}
.slot.dim{opacity:.35;transition:opacity .2s}
.slot.fx .shirt{box-shadow:0 0 0 4px #ffe066,0 2px 8px rgba(0,0,0,.4);transform:scale(1.12)}
.slot.partner .shirt{box-shadow:0 0 0 4px #60a5fa,0 2px 8px rgba(0,0,0,.4)}
.chip.dim{opacity:.4}.chip.fx{box-shadow:0 0 0 2px #eab308;background:#fef9c3}.chip.partner{box-shadow:0 0 0 2px #60a5fa;background:#eff6ff}
.chip .lnk{text-decoration:none}
.focus{background:#fffbea;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.focus .x{cursor:pointer;color:var(--muted);font-size:16px;padding:0 4px}
.focus a{text-decoration:underline}
ul.fsubs li{grid-template-columns:44px 110px 1fr}

.sbc{font:700 10px Inter,sans-serif;background:#16a34a;color:#fff;border-radius:4px;padding:1px 5px}

/* ---------- общие исправления переполнения ---------- */
.grid>*,.hero>*,.lineup>*,.mrow>div{min-width:0}
/* ---------- телефон ---------- */
@media(max-width:760px){
  body{font-size:14px;-webkit-text-size-adjust:100%}
  .top{padding-top:env(safe-area-inset-top)}
  .top-in{padding:8px 14px;gap:10px}
  .top img{height:40px}
  .brand b{font-size:17px}.brand span{font-size:10.5px}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(0,0,0,.08);
      display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;border-radius:10px;color:#6b7280;font-size:10.5px;font-weight:600;opacity:1}
  nav a:hover{background:none}
  nav a.on{background:none;color:var(--red)}
  nav svg{display:block;width:23px;height:23px}
  main{padding:12px}
  footer{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .card{padding:14px;border-radius:12px}
  h2{font-size:16px}
  .grid,.hero{gap:12px}
  /* вкладки — горизонтальная прокрутка */
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .card .tabs{margin-left:-14px;margin-right:-14px;padding:0 14px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;flex:none;padding:7px 12px}
  /* главная */
  .next{padding:16px}
  .vs .t{font-size:15px}.vs .t .crest{width:46px;height:46px}.vs .mid{font-size:24px;min-width:70px}
  .tile{padding:10px}.tile b{font-size:22px}
  /* матчи */
  .mrow{grid-template-columns:62px 1fr auto;gap:8px;padding:10px 2px}
  .mrow .dt{font-size:11px}.mrow .dt b{font-size:12px}
  .crest{width:28px;height:28px;font-size:10px}
  .mhead{padding:16px 12px}.mhead .vs .mid{font-size:34px}
  .tl li{grid-template-columns:1fr 34px 1fr;gap:6px;font-size:12.5px}
  .tl .min{font-size:12px}
  /* игроки */
  .pgrid{grid-template-columns:1fr 1fr;gap:8px}
  .pcard{padding:10px;gap:8px;flex-direction:column;align-items:flex-start}
  .badge{width:38px;height:38px;font-size:17px;border-radius:10px}
  .phead{padding:16px;gap:14px}.phead .big{font-size:48px;min-width:56px}.phead h1{font-size:23px}
  .info{grid-template-columns:1fr 1fr}
  td,th{padding:7px 5px}
  /* состав */
  .slot{width:62px}
  .shirt{width:36px;height:36px;font-size:15px}
  .slot .nm{font-size:9.5px;padding:1px 4px;max-width:66px}
  .slot .role{font-size:9px}
  .cap{width:14px;height:14px;font-size:8px}
  .sb{font-size:9px;padding:0 3px;line-height:13px;right:-20px}
  .rm{width:22px;height:22px;line-height:22px;right:4px;top:-8px}
  .edit .slot.f .rm{display:none}.edit .slot.sel .rm{display:block}
  .kits .kit{padding:6px 9px}
  .focus{font-size:12.5px}
  ul.subs li{grid-template-columns:26px 1fr 1fr 18px;font-size:12.5px;gap:6px}
  ul.fsubs li{grid-template-columns:26px 92px 1fr}
  .subform select{flex:1 1 100%}
  .subform button{width:100%}
  #lcap,#fpick,#lmatch{max-width:100%;flex:1 1 auto}
  .lst{max-height:none}
  .chip{font-size:11.5px}
  select,input[type=search]{font-size:16px} /* без автозума в iOS */
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}
@media(max-width:380px){.pgrid{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr}}

/* партнёры */
.partners{background:#16181d;color:#fff;margin-top:24px}
.pin{max-width:1180px;margin:0 auto;padding:22px 20px;display:flex;align-items:center;gap:28px;flex-wrap:wrap;justify-content:center}
.plbl{font:600 12px Oswald,sans-serif;text-transform:uppercase;letter-spacing:1.5px;opacity:.6}
.plogos{display:flex;align-items:center;gap:40px}
.plogos img{display:block;opacity:.92}
.plogos .sp-jogel{height:54px}.plogos .sp-pims{height:26px}
.nsp{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1)}
.nsp span{font-size:10px;text-transform:uppercase;letter-spacing:1px;opacity:.55}
.nsp img{display:block;opacity:.85}.nsp .sp-jogel{height:30px}.nsp .sp-pims{height:15px}
@media(max-width:760px){.pin{padding:18px 14px;gap:14px;flex-direction:column}.plogos{gap:30px}.plogos .sp-jogel{height:44px}.plogos .sp-pims{height:22px}.partners{margin-top:12px}}

/* фото игроков */
.av{width:32px;height:32px;border-radius:50%;object-fit:cover;object-position:50% 12%;flex:none;background:#e5e1da;display:inline-flex;align-items:center;justify-content:center;font:600 12px Oswald,sans-serif;color:#57534e}
.av28{width:28px;height:28px}.av26{width:26px;height:26px;font-size:11px}.av24{width:24px;height:24px;font-size:10px}.av36{width:38px;height:38px}
.noph{background:#ece8e1}
.nmcell{display:inline-flex;align-items:center;gap:8px;vertical-align:middle}
.lname{display:flex;align-items:center;gap:10px;min-width:0}
.pph{position:relative;width:56px;height:62px;flex:none}
.pph img{width:56px;height:62px;border-radius:12px;object-fit:cover;object-position:50% 10%;display:block;background:#222}
.pnum{position:absolute;right:-6px;bottom:-6px;background:var(--red);color:#fff;font:600 12px Oswald,sans-serif;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff}

.hph{width:112px;height:126px;border-radius:14px;object-fit:cover;object-position:50% 10%;border:3px solid rgba(255,255,255,.85);box-shadow:0 6px 18px rgba(0,0,0,.25);position:relative;z-index:1}
.chip .av24{margin-right:-2px}
.shirt.hasph{padding:0;overflow:visible}
.shirt .face{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 12%;display:block}
.slot.f .shirt.hasph{border-width:3px;border-color:var(--kit,var(--red))}
.slot.f .shirt.hasph{background:#222}
.snum{position:absolute;right:-7px;bottom:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--kit,var(--red));color:#fff;font:600 11px Oswald,sans-serif;display:flex;align-items:center;justify-content:center;padding:0 4px;border:1.5px solid #fff}
.slot.gk .snum{background:var(--kit,#16a34a)}
.slot .shirt.hasph{width:50px;height:50px}
@media(max-width:760px){
  .hph{width:84px;height:94px;border-radius:12px}
  .phead .big{font-size:34px;min-width:auto}
  .slot .shirt.hasph{width:40px;height:40px}
  .snum{min-width:15px;height:15px;font-size:9.5px;right:-6px;bottom:-4px}
  .pcard{flex-direction:row;align-items:center}
  .pph{width:46px;height:52px}.pph img{width:46px;height:52px;border-radius:10px}
}
.focus>.row{flex-wrap:nowrap;align-items:flex-start;gap:8px}.focus .nmcell{min-width:0}

<script id="app-src">
// ---------- утилиты ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MON3=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const WD=["вс","пн","вт","ср","чт","пт","сб"];
const dObj=s=>new Date(s+"T12:00:00");
const dLong=s=>{const d=dObj(s);return `${d.getDate()} ${MON[d.getMonth()]}`};
const dShort=s=>{const d=dObj(s);return `${d.getDate()} ${MON3[d.getMonth()]}`};
const wd=s=>WD[dObj(s).getDay()];
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const n1=n%10;return n>10&&n<20?c:n1>1&&n1<5?b:n1===1?a:c};
const COLORS=["#334155","#7c2d12","#1e3a8a","#14532d","#581c87","#9f1239","#0f766e","#854d0e","#3f3f46","#155e75"];
const crest=name=>{let h=0;for(const ch of name)h=(h*31+ch.charCodeAt(0))>>>0;const ini=name.replace(/[^A-Za-zА-Яа-яЁё ]/g,"").split(/\s+/).filter(Boolean).map(w=>w[0]).join("").slice(0,2).toUpperCase();return `<span class="crest" style="background:${COLORS[h%COLORS.length]}">${esc(ini)}</span>`};
const usCrest='<span class="crest us" title="Ноттингем Форест"></span>';
let tt;function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),2400)}

// ---------- данные ----------
let D,PL,ALL,BY,PLAYED,UPCOMING,SEASONS,CUR="2026";
const TODAY="2026-11-18";
const res=m=>m.us>m.them?"W":m.us<m.them?"L":"D";
const resRu={W:"В",D:"Н",L:"П"};
const fullName=p=>`${p.n} ${p.f}`;
const short=p=>`${p.n[0]}. ${p.f}`;
const isGK=p=>p.pos==="ВРТ";
const played=m=>m.us!=null;
const blank=()=>({gp:0,g:0,a:0,y:0,r:0,w:0,d:0,l:0,cap:0});
const ST={}; // ST[id][season|"all"] = итоги; ST[id].log — все матчи
function add(s,g,a,y,r,c,m){s.gp++;s.g+=g;s.a+=a;s.y+=y;s.r+=r;s.cap+=c;s[res(m).toLowerCase()]++}

function prepare(){
  ALL=D.players; PL=ALL.filter(p=>!p.former); BY=Object.fromEntries(ALL.map(p=>[p.id,p]));
  PLAYED=D.matches.filter(played);
  UPCOMING=D.matches.filter(m=>!played(m)&&m.d>=TODAY);
  SEASONS=[...new Set(D.matches.map(m=>m.sn))].reverse(); // новые сверху
  for(const p of ALL) ST[p.id]={all:blank(),log:[],lg:{}};
  for(const m of PLAYED) for(const [id,g,a,y,r,c] of (m.ln||[])){
    const s=ST[id]; if(!s) continue;
    add(s.all,g,a,y,r,c,m); add(s[m.sn]||(s[m.sn]=blank()),g,a,y,r,c,m);
    const k=m.sn+"|"+m.lg; add(s.lg[k]||(s.lg[k]=blank()),g,a,y,r,c,m);
    s.log.push({m,g,a,y,r});
  }
  $("#upd").textContent=dLong(D.updated)+" "+D.updated.slice(0,4);
}
const pst=(id,sn)=>ST[id][sn]||blank();
function teamStats(list){const t={gp:0,w:0,d:0,l:0,gf:0,ga:0};for(const m of list){t.gp++;t[res(m).toLowerCase()]++;t.gf+=m.us;t.ga+=m.them}return t}
const seasonMatches=sn=>sn==="all"?PLAYED:PLAYED.filter(m=>m.sn===sn);
const snLabel=sn=>sn==="all"?"Вся история":"Сезон "+sn;
const seasonTabs=(id,cur,withAll)=>`<div class="tabs" id="${id}">${withAll?`<span class="tab ${cur==="all"?"on":""}" data-sn="all">Вся история</span>`:""}${SEASONS.map(s=>`<span class="tab ${cur===s?"on":""}" data-sn="${esc(s)}">${esc(s)}</span>`).join("")}</div>`;

// ---------- компоненты ----------
function matchRow(m){
  const home=m.h?{n:"Ноттингем Форест",c:usCrest,b:1}:{n:m.opp,c:crest(m.opp)};
  const away=m.h?{n:m.opp,c:crest(m.opp)}:{n:"Ноттингем Форест",c:usCrest,b:1};
  const hs=m.h?m.us:m.them, as=m.h?m.them:m.us;
  const right=played(m)?`<span style="display:flex;flex-direction:column;align-items:center;line-height:1.35">${hs}<br>${as}</span><span class="res ${res(m)}">${resRu[res(m)]}</span>`:(m.d>=TODAY?'<span class="pill">скоро</span>':'<span class="pill">не сыгран</span>');
  return `<a class="mrow" href="#match-${m.id}">
    <div class="dt"><b>${dShort(m.d)}, ${wd(m.d)}</b>${m.d.slice(0,4)!==TODAY.slice(0,4)?m.d.slice(0,4)+" · ":""}${m.t||"время ?"}</div>
    <div>
      <div class="teams">${home.c}<span class="nm" style="${home.b?"font-weight:600":""}">${esc(home.n)}</span></div>
      <div class="teams" style="margin-top:4px">${away.c}<span class="nm" style="${away.b?"font-weight:600":""}">${esc(away.n)}</span></div>
      <div class="small muted" style="margin-top:4px">${esc(m.lg)} · ${esc(m.st)}${m.s===5?" · <b>техн.</b>":""}</div>
    </div>
    <div class="sc">${right}</div>
  </a>`;
}
function vsBlock(m){
  const L=m.h?["Ноттингем Форест",usCrest]:[m.opp,crest(m.opp)], R=m.h?[m.opp,crest(m.opp)]:["Ноттингем Форест",usCrest];
  const mid=played(m)?`${m.h?m.us:m.them} : ${m.h?m.them:m.us}`:(m.t||"—");
  return `<div class="vs"><div class="t">${L[1]}<div>${esc(L[0])}</div></div><div class="mid">${mid}</div><div class="t">${R[1]}<div>${esc(R[0])}</div></div></div>`;
}
let PHOTOS={};try{PHOTOS=JSON.parse(document.getElementById("photos-data").textContent)||{}}catch(e){}
const photo=p=>p&&PHOTOS[p.id];
const ava=(p,cls="av")=>photo(p)?`<img class="${cls}" src="${photo(p)}" alt="" loading="lazy">`:`<span class="${cls} noph">${p&&p.num!=null?p.num:"–"}</span>`;
const posOrder={ВРТ:0,ЗАЩ:1,ПЗЩ:2,УНИ:3,НАП:4};
const posName={ВРТ:"Вратари",ЗАЩ:"Защитники",ПЗЩ:"Полузащитники",УНИ:"Универсалы",НАП:"Нападающие"};
const posFull={ВРТ:"Вратарь",ЗАЩ:"Защитник",ПЗЩ:"Полузащитник",УНИ:"Универсал",НАП:"Нападающий"};
const tile=(v,l,st="")=>`<div class="tile"><b style="${st}">${v}</b><span>${l}</span></div>`;

// ---------- главная ----------
function pageHome(){
  const next=UPCOMING[0], ts=teamStats(PLAYED), last5=PLAYED.slice(-5);

  const leaders=(title,k)=>{const t=top(k);const max=t[0]?t[0].v:1;return `<div class="card"><h3>${title}</h3>${t.map((x,i)=>`<a class="leader" href="#player-${x.p.id}"><span class="muted">${i+1}</span><span class="lname">${ava(x.p,"av av28")}<span style="flex:1;min-width:0"><b>${esc(fullName(x.p))}</b><div class="bar" style="margin-top:4px"><i style="width:${x.v/max*100}%"></i></div></span></span><span class="v">${x.v}</span></a>`).join("")}</div>`};
  return `

    </div>`:`<div class="next"><div class="lbl">Ближайший матч</div><p>Новых матчей пока нет</p></div>`}
    <div class="card">
      <h3>Вся история · с 2024 года</h3>
      <div class="tiles">${tile(ts.gp,"Матчей")}${tile(ts.w,"Побед","color:var(--w)")}${tile(ts.d,"Ничьих")}${tile(ts.l,"Поражений","color:var(--l)")}${tile(ts.gf,"Забито")}${tile(ts.ga,"Пропущено")}</div>

    </div>

  <div class="grid g2">

    <div class="card"><h2>Последние результаты</h2>${PLAYED.slice(-5).reverse().map(matchRow).join("")}<a class="small muted" href="#matches">Вся история →</a></div>

// ---------- матчи ----------
let mFilter={sn:"2026",lg:""};
function pageMatches(){
  const inS=D.matches.filter(m=>mFilter.sn==="all"||m.sn===mFilter.sn);
  const lgs=[...new Set(inS.map(m=>m.lg))];
  if(mFilter.lg&&!lgs.includes(mFilter.lg)) mFilter.lg="";
  const list=inS.filter(m=>!mFilter.lg||m.lg===mFilter.lg);
  const up=list.filter(m=>!played(m)&&m.d>=TODAY), pl=list.filter(m=>played(m)||m.d<TODAY).reverse();
  const ts=teamStats(list.filter(played));
  return `<div class="card">
    <h2>Матчи</h2>
    ${seasonTabs("sntabs",mFilter.sn,true)}
    <div class="tabs" id="lgtabs"><span class="tab ${!mFilter.lg?"on":""}" data-lg="">Все турниры</span>${lgs.map(l=>`<span class="tab ${mFilter.lg===l?"on":""}" data-lg="${esc(l)}">${esc(l)}</span>`).join("")}</div>
    <p class="small muted">${ts.gp} ${plural(ts.gp,"матч","матча","матчей")} сыграно: ${ts.w} В · ${ts.d} Н · ${ts.l} П, мячи ${ts.gf}–${ts.ga}</p>
    ${up.length?`<h3 style="margin-top:16px">Предстоящие</h3>${up.map(matchRow).join("")}`:""}
    <h3 style="margin-top:20px">Сыгранные</h3>${pl.map(matchRow).join("")||'<p class="muted">Нет матчей</p>'}
  </div>`;
}
function bindMatches(){
  $("#lgtabs").onclick=e=>{const t=e.target.closest(".tab");if(!t)return;mFilter.lg=t.dataset.lg;render()};
  $("#sntabs").onclick=e=>{const t=e.target.closest(".tab");if(!t)return;mFilter.sn=t.dataset.sn;mFilter.lg="";render()};
}

function pageMatch(id){
  const m=D.matches.find(x=>x.id===+id); if(!m) return `<div class="card">Матч не найден</div>`;
  const nm=v=>typeof v==="number"?(BY[v]?`<a href="#player-${v}"><b>${esc(short(BY[v]))}</b></a>`:"—"):(v?esc(v):'<span class="muted">соперник</span>');
  let usG=0,thG=0;
  const evs=(m.ev||[]).map(e=>{
    let html;
    if(e[0]==="g"){ if(e[2])usG++;else thG++; const sc=m.h?`${usG}:${thG}`:`${thG}:${usG}`;
      html=`<span class="ball">⚽</span>${nm(e[3])}${e[4]?` <span class="small muted">(пас: ${typeof e[4]==="number"?(BY[e[4]]?esc(short(BY[e[4]])):"—"):esc(e[4])})</span>`:""} <span class="pill">${sc}</span>`; }
    else html=`<span class="ic ${e[0]}"></span>${nm(e[3])}`;
    return `<li><div class="l">${e[2]?html:""}</div><div class="min">${e[1]}'</div><div>${e[2]?"":html}</div></li>`;
  }).join("");
  const ln=(m.ln||[]).map(([id,g,a,y,r,c])=>({p:BY[id],g,a,y,r,c})).filter(x=>x.p).sort((a,b)=>posOrder[a.p.pos]-posOrder[b.p.pos]||(a.p.num||99)-(b.p.num||99));
  const upcoming=!played(m)&&m.d>=TODAY;
  return `<a class="back" href="#matches">← Все матчи</a>
  <div class="mhead"><div class="small" style="opacity:.75">Сезон ${esc(m.sn)} · ${esc(m.lg)} · ${esc(m.st)}</div>${vsBlock(m)}
    <div class="small" style="opacity:.8">${dLong(m.d)} ${m.d.slice(0,4)}, ${wd(m.d)}${m.t?" · "+m.t:""} · ${esc(m.ven||"БЕТСИТИ АРЕНА, поле №1")}</div>
    ${m.note?`<div class="pill" style="margin-top:10px">${esc(m.note)}</div>`:""}
    ${played(m)?`<div style="margin-top:10px"><span class="res ${res(m)}" style="width:auto;padding:0 10px">${{W:"Победа",D:"Ничья",L:"Поражение"}[res(m)]}</span></div>`:""}
  </div>
  ${!played(m)?`<div class="card">${upcoming?`Матч ещё не сыгран. <a href="#lineup" style="text-decoration:underline">Посмотреть состав на матч →</a>`:"Матч не состоялся."}</div>`:`
  <div class="grid g2">
    <div class="card"><h2>Ход матча</h2>${evs?`<div class="row small muted" style="justify-content:space-between;margin-bottom:6px"><span>Ноттингем Форест</span><span>${esc(m.opp)}</span></div><ul class="tl">${evs}</ul>`:'<p class="muted">Протокол событий не заполнен</p>'}</div>
    <div class="card"><h2>Наш состав</h2>${ln.length?`<table><tr><th>№</th><th>Игрок</th><th class="c">Г</th><th class="c">П</th><th class="c">ЖК</th><th class="c">КК</th></tr>${ln.map(x=>`<tr class="link" onclick="location.hash='player-${x.p.id}'"><td class="no">${x.p.num??""}</td><td><span class="nmcell">${ava(x.p,"av av26")}<span>${esc(fullName(x.p))}${x.c?' <span class="pill">К</span>':""} <span class="pos p-${x.p.pos}">${x.p.pos}</span></span></span></td><td class="c">${x.g||""}</td><td class="c">${x.a||""}</td><td class="c">${x.y||""}</td><td class="c">${x.r||""}</td></tr>`).join("")}</table>`:'<p class="muted">Заявка на матч не заполнена на сайте лиги</p>'}</div>
  </div>`}`;
}

// ---------- статистика ----------
let sSort={k:"ga",dir:-1}, sSn="2026";
function pageStats(){
  const list=seasonMatches(sSn);
  const lgs=[...new Set(list.map(m=>m.lg))];
  const tr=(l,t,b)=>`<tr${b?' style="font-weight:700"':""}><td>${l}</td><td class="c">${t.gp}</td><td class="c">${t.w}</td><td class="c">${t.d}</td><td class="c">${t.l}</td><td class="c">${t.gf}–${t.ga}</td><td class="c">${t.gf-t.ga>0?"+":""}${t.gf-t.ga}</td></tr>`;
  const head=first=>`<tr><th>${first}</th><th class="c">И</th><th class="c">В</th><th class="c">Н</th><th class="c">П</th><th class="c">Мячи</th><th class="c">±</th></tr>`;
  const allT=teamStats(PLAYED), selT=teamStats(list);
  const P=ALL.map(p=>{const s=pst(p.id,sSn);return {p,gp:s.gp,g:s.g,a:s.a,ga:s.g+s.a,y:s.y,r:s.r,gpg:s.gp?s.g/s.gp:0}}).filter(x=>x.gp>0);
  P.sort((x,y)=>{const k=sSort.k;if(k==="name")return sSort.dir*x.p.f.localeCompare(y.p.f,"ru");if(k==="num")return sSort.dir*((x.p.num??999)-(y.p.num??999));return sSort.dir*(x[k]-y[k])||y.gp-x.gp});
  const th=(k,l,c="c")=>`<th class="${c} ${sSort.k===k?"on":""}" data-s="${k}">${l}${sSort.k===k?(sSort.dir<0?" ↓":" ↑"):""}</th>`;
  const bigW=[...PLAYED].sort((a,b)=>(b.us-b.them)-(a.us-a.them))[0];
  const scorers=ALL.map(p=>({p,g:pst(p.id,"all").g})).sort((a,b)=>b.g-a.g)[0];
  const apps=ALL.map(p=>({p,gp:pst(p.id,"all").gp})).sort((a,b)=>b.gp-a.gp)[0];
  return `
  <div class="card" style="margin-bottom:16px"><h2>Вся история команды</h2>
    <div class="tiles" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))">${tile(allT.gp,"Матчей")}${tile(`${allT.w}–${allT.d}–${allT.l}`,"В–Н–П")}${tile(`${allT.gf}–${allT.ga}`,"Мячи")}${tile(SEASONS.length,"Сезонов")}
      ${tile(`<a href="#player-${scorers.p.id}">${scorers.g}</a>`,"Лучший бомбардир: "+esc(short(scorers.p)))}${tile(`<a href="#player-${apps.p.id}">${apps.gp}</a>`,"Больше всех матчей: "+esc(short(apps.p)))}
      ${bigW?tile(`<a href="#match-${bigW.id}">${bigW.us}:${bigW.them}</a>`,"Крупнейшая победа: "+esc(bigW.opp)):""}${tile(D.alltime.rating,"Рейтинг лиги · "+D.alltime.place+" место")}</div>
    <h3 style="margin-top:18px">По сезонам</h3>
    <div class="scroll-x"><table>${head("Сезон")}${SEASONS.map(sn=>tr(esc(sn),teamStats(seasonMatches(sn)))).join("")}${tr("Всего",allT,1)}</table></div>
  </div>
  ${seasonTabs("stsn",sSn,true)}
  <div class="card" style="margin-bottom:16px"><h2>Команда · ${snLabel(sSn)}</h2><div class="scroll-x"><table>${head("Турнир")}${lgs.map(l=>tr(esc(l),teamStats(list.filter(m=>m.lg===l)))).join("")}${tr("Всего",selT,1)}</table></div>
    ${selT.gp?`<p class="small muted" style="margin:10px 0 0">${(selT.gf/selT.gp).toFixed(2)} забито и ${(selT.ga/selT.gp).toFixed(2)} пропущено в среднем за матч</p>`:""}</div>
  <div class="card"><h2>Игроки · ${snLabel(sSn)}</h2>${P.length?`<div class="scroll-x"><table id="st"><thead><tr>${th("num","№","")}${th("name","Игрок","")}<th>Амп.</th>${th("gp","И")}${th("g","Г")}${th("a","П")}${th("ga","Г+П")}${th("gpg","Г/И")}${th("y","ЖК")}${th("r","КК")}</tr></thead><tbody>
  ${P.map(x=>`<tr class="link" onclick="location.hash='player-${x.p.id}'" ${x.p.former?'style="color:#6b7280"':""}><td class="no">${x.p.num??""}</td><td><span class="nmcell">${ava(x.p,"av av26")}<span>${esc(fullName(x.p))}${x.p.former?' <span class="small">(бывший)</span>':""}</span></span></td><td><span class="pos p-${x.p.pos}">${x.p.pos}</span></td><td class="c">${x.gp}</td><td class="c">${x.g}</td><td class="c">${x.a}</td><td class="c"><b>${x.ga}</b></td><td class="c">${x.gpg.toFixed(2)}</td><td class="c">${x.y}</td><td class="c">${x.r}</td></tr>`).join("")}</tbody></table></div>`:'<p class="muted">В этом сезоне на сайте лиги не заполнены заявки на матчи</p>'}
  <p class="small muted" style="margin:10px 0 0">Посчитано по протоколам матчей. Матчи без заполненной заявки (технические результаты и часть игр «Лужников») в личную статистику не попадают.</p></div>`;
}
function bindStats(){
  const t=$("#st thead"); if(t) t.onclick=e=>{const x=e.target.closest("th[data-s]");if(!x)return;const k=x.dataset.s;if(sSort.k===k)sSort.dir*=-1;else{sSort.k=k;sSort.dir=(k==="name"||k==="num")?1:-1}render()};
  $("#stsn").onclick=e=>{const x=e.target.closest(".tab");if(!x)return;sSn=x.dataset.sn;render()};
}

function buildSlots(rows){
  const slots=[{x:50,y:91,role:"ВРТ"}],n=rows.length,top=17,bottom=74;
  rows.forEach((cnt,ri)=>{const y=bottom-(bottom-top)*ri/(n-1);const role=ri===0?"ЗАЩ":ri===n-1?"НАП":"ПЗЩ";const sp=cnt===1?0:Math.min(78,22*(cnt-1));
    for(let i=0;i<cnt;i++)slots.push({x:cnt===1?50:50-sp/2+sp*i/(cnt-1),y,role})});
  return slots;
}

    :`<li><span class="smin">${x.n}.</span><span class="si">↑ выходишь</span><span>вместо <a href="#" data-fp="${x.out}"><b>${BY[x.out].num}</b> ${esc(short(BY[x.out]))}</a></span></li>`).join("");

function validateSubs(){
  if((L.subs||[]).some(s=>s.min!=null)) L.subs=L.subs.slice().sort((a,b)=>(a.min||0)-(b.min||0));
  const squad=new Set([...L.lineup.filter(Boolean),...L.bench]), seen=new Set(), keep=[];
  for(const s of sortedSubs()){
    const k=s.out+">"+s.in;
    if(BY[s.out]&&BY[s.in]&&s.out!==s.in&&squad.has(s.out)&&squad.has(s.in)&&!seen.has(k)){ keep.push({out:s.out,in:s.in}); seen.add(k); }
  }
  L.subs=keep;
}

let ART=null, DIRTY=false, PUBLISHING=false;
const PUB=(()=>{try{return JSON.parse(document.getElementById("lineup-data").textContent)||{}}catch(e){return {}}})();

const HEAD=`<meta charset="utf-8">

async function publishLineup(){
  if(!ART||PUBLISHING) return;
  PUBLISHING=true; render();
  const state=JSON.parse(JSON.stringify(L)); state.publishedAt=Date.now(); delete state.updatedAt;
  try{ await ART.publish(buildDoc(state)); try{localStorage.removeItem("nffc-draft")}catch(e){} DIRTY=false; toast("Состав опубликован") }
  catch(e){ const c=e&&e.code;
    if(c==="conflict") toast("Страницу только что обновили — проверьте состав и опубликуйте снова");
    else if(c==="not_granted"||c==="not_writer"){ CAN_EDIT=false; MODE="view"; toast("Нет прав на публикацию") }
    else toast("Не удалось опубликовать: "+(e&&(e.message||c)||"ошибка"));
  }
  PUBLISHING=false; render();
}

function place(id){
  const sl=slots(),cur=L.lineup.indexOf(id); L.bench=L.bench.filter(x=>x!==id);
  if(sel!==null){ if(cur>=0) L.lineup[cur]=L.lineup[sel]; L.lineup[sel]=id; sel=null; return changed() }
  if(cur>=0){ L.lineup[cur]=null; if(L.cap===id) L.cap=null; return changed() }
  const p=BY[id]; const tests=[s=>s.role===p.pos,s=>ROLE_OK[s.role].includes(p.pos),s=>(s.role==="ВРТ")===(p.pos==="ВРТ"),()=>true];
  let idx=-1; for(const t of tests){idx=sl.findIndex((s,i)=>!L.lineup[i]&&t(s));if(idx>=0)break}
  if(idx<0) return toast("Все места заняты — выберите позицию, чтобы заменить игрока");
  L.lineup[idx]=id; changed();
}
function toBench(id){
  if(L.bench.includes(id)){ L.bench=L.bench.filter(x=>x!==id); if(L.cap===id&&!L.lineup.includes(id)) L.cap=null; }
  else { if(L.bench.length>=FORMATS[L.fmt].bench) return toast("Скамейка заполнена"); const i=L.lineup.indexOf(id); if(i>=0)L.lineup[i]=null; L.bench.push(id) }
  changed();
}
function auto(){
  const sl=slots(),used=new Set(); L.lineup=sl.map(()=>null);
  const score=p=>{const s=pst(p.id,CUR);return (s.g+s.a)*2+s.gp};
  const rank={ВРТ:0,НАП:1,ПЗЩ:2,ЗАЩ:3};
  sl.map((s,i)=>i).sort((a,b)=>rank[sl[a].role]-rank[sl[b].role]).forEach(i=>{
    for(const pos of ROLE_PREF[sl[i].role]){const c=PL.filter(p=>p.pos===pos&&!used.has(p.id)).sort((a,b)=>score(b)-score(a))[0];if(c){L.lineup[i]=c.id;used.add(c.id);break}}
  });
  L.bench=PL.filter(p=>!used.has(p.id)).sort((a,b)=>score(b)-score(a)).slice(0,FORMATS[L.fmt].bench).map(p=>p.id);
  const c=PL.find(p=>p.cap&&used.has(p.id)); L.cap=c?c.id:null; sel=null; changed(); toast("Собрал по амплуа и результативности сезона");
}
function lineupText(){
  const sl=slots(),g={ВРТ:[],ЗАЩ:[],ПЗЩ:[],НАП:[]},m=D.matches.find(x=>x.id===L.matchId);
  sl.forEach((s,i)=>{const p=BY[L.lineup[i]];if(p)g[s.role].push(`${p.num} ${fullName(p)}${L.cap===p.id?" (к)":""}`)});
  let t=`Ноттингем Форест${m?` — ${m.opp}, ${dLong(m.d)}${m.t?" "+m.t:""}`:""}\nСхема ${L.form} (${FORMATS[L.fmt].label})\nФорма: ${KIT[L.kitField].n}, у вратаря — ${KIT[L.kitGK].n}\n\n`;
  const nm={ВРТ:"Вратарь",ЗАЩ:"Защита",ПЗЩ:"Полузащита",НАП:"Нападение"};
  for(const k in g) if(g[k].length) t+=`${nm[k]}: ${g[k].join(", ")}\n`;
  if(L.bench.length) t+=`\nЗапасные: ${L.bench.map(id=>BY[id].num+" "+fullName(BY[id])+(L.cap===id?" (к)":"")).join(", ")}\n`;
  const ss=sortedSubs(); if(ss.length) t+=`\nЗамены:\n${ss.map((s,i)=>`${i+1}. ${fullName(BY[s.out])} → ${fullName(BY[s.in])}`).join("\n")}\n`;
  return t;
}
function bindLineup(){
  const on=(s,ev,f)=>{const e=$(s);if(e)e[ev]=f};
  on("#lcopy","onclick",async()=>{const t=lineupText(),o=$("#out");o.value=t;try{await navigator.clipboard.writeText(t);o.style.display="none";toast("Состав скопирован")}catch(e){o.style.display="block";o.select();toast("Скопируйте текст из поля ниже")}});
  const setFocus=id=>{FOCUS=FOCUS===id?null:id;render()};
  on("#fpick","onchange",e=>{FOCUS=e.target.value?+e.target.value:null;render()});
  on("#fclose","onclick",()=>{FOCUS=null;render()});
  document.querySelectorAll(".focus [data-fp]").forEach(a=>a.onclick=e=>{e.preventDefault();FOCUS=+a.dataset.fp;render()});
  if(!CAN_EDIT){
    on("#pitch","onclick",e=>{const s=e.target.closest(".slot");if(!s)return;const id=L.lineup[+s.dataset.i];if(id)setFocus(id)});
    document.querySelectorAll(".chip[data-fp]").forEach(c=>c.onclick=()=>setFocus(+c.dataset.fp));
  }
  if(!CAN_EDIT) return;
  on("#sout","onchange",e=>{subDraft.out=e.target.value;if(subDraft.in===subDraft.out)subDraft.in="";render()});
  on("#sin","onchange",e=>{subDraft.in=e.target.value});
  on("#sadd","onclick",()=>{const out=+subDraft.out, inn=+subDraft.in;
    if(!out||!inn) return toast("Выберите, кто уходит и кто выходит");
    if(out===inn) return toast("Игрок не может заменить сам себя");
    if(sortedSubs().some(s=>s.out===out&&s.in===inn)) return toast("Такая замена уже есть");
    L.subs=sortedSubs().concat([{out,in:inn}]); validateSubs(); subDraft={out:"",in:""}; changed() });
  document.querySelectorAll("[data-ds]").forEach(x=>x.onclick=()=>{const k=+x.dataset.ds;L.subs=L.subs.filter((s,i)=>i!==k);validateSubs();changed()});
  on("#lmatch","onchange",e=>{L.matchId=e.target.value?+e.target.value:null;changed()});
  on("#lfmt","onchange",e=>{L.fmt=e.target.value;L.form=Object.keys(FORMATS[L.fmt].forms)[0];L.bench=L.bench.slice(0,FORMATS[L.fmt].bench);sel=null;norm();changed()});
  on("#lform","onchange",e=>{L.form=e.target.value;sel=null;norm();changed()});
  on("#kits","onclick",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.kf)L.kitField=b.dataset.kf;if(b.dataset.kg)L.kitGK=b.dataset.kg;changed()});
  on("#lcap","onchange",e=>{L.cap=e.target.value?+e.target.value:null;changed()});
  on("#lauto","onclick",auto);
  on("#lpub","onclick",publishLineup);
  on("#lrevert","onclick",revert);
  on("#lclear","onclick",()=>{L.lineup=[];L.bench=[];L.cap=null;L.subs=[];sel=null;norm();changed()});
  on("#lq","oninput",e=>{lq=e.target.value;const pos=e.target.selectionStart;render();const n=$("#lq");if(n){n.focus();n.setSelectionRange(pos,pos)}});
  on("#lpos","onchange",e=>{lpos=e.target.value;render()});
  on("#pitch","onclick",e=>{const s=e.target.closest(".slot");if(!s)return;const i=+s.dataset.i;
    if(e.target.classList.contains("rm")){const id=L.lineup[i];L.lineup[i]=null;if(L.cap===id)L.cap=null;sel=null;return changed()}
    if(sel!==null&&sel!==i){[L.lineup[sel],L.lineup[i]]=[L.lineup[i],L.lineup[sel]];sel=null;return changed()}
    sel=sel===i?null:i;render()});
  document.querySelectorAll(".lst tr[data-id]").forEach(tr=>tr.onclick=e=>{const b=e.target.closest("[data-b]");if(b)return toBench(+b.dataset.b);place(+tr.dataset.id)});
  document.querySelectorAll("[data-rb]").forEach(x=>x.onclick=()=>toBench(+x.dataset.rb));
}

async function initLineupStore(){
  if(!window.claude||typeof window.claude.use!=="function"){ MODE="view"; CAN_EDIT=false; render(); return }
  const [user,art]=await Promise.all([claude.use("user").catch(()=>null),claude.use("artifact").catch(()=>null)]);
  let owner=false; try{ owner=user?!!(await user.isOwner()):false }catch(e){}
  if(owner&&art){ ART=art; MODE="owner"; CAN_EDIT=true; loadDraft() } else { MODE="view"; CAN_EDIT=false }
  render();
}

function render(){
  const h=location.hash.slice(1)||"home";
  let html,bind,nav=h;
  let m;
  if(m=h.match(/^match-(\d+)$/)){html=pageMatch(m[1]);nav="matches"}
  else if(m=h.match(/^player-(\d+)$/)){html=pagePlayer(m[1]);nav="squad";const pid=m[1];bind=()=>bindPlayer(pid)}
  else { const v=VIEWS[h]||VIEWS.home; html=v[0](); bind=v[1]; nav=VIEWS[h]?h:"home" }
  $("#app").innerHTML=html; if(bind) bind();
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===nav));
  if(h!==lastRoute){ if(lastRoute) window.scrollTo(0,0); lastRoute=h; sel=null; }
}
